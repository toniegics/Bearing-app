<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bearing – geospatial industry app</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#12292e;--mute:#5d7175;--line:#d5dedd;--acc:#f2542d;--accInk:#fff;--teal:#0f6b73;--tealBg:#dcedee;--hdr:#12292e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b1e;--card:#15292d;--ink:#e6efee;--mute:#93a9ac;--line:#25403f;--tealBg:#173c40;--teal:#5cc3cb;--hdr:#1c4148}}
:root[data-theme="dark"]{--bg:#0d1b1e;--card:#15292d;--ink:#e6efee;--mute:#93a9ac;--line:#25403f;--tealBg:#173c40;--teal:#5cc3cb;--hdr:#1c4148}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
header{padding:18px 16px 12px;background:var(--hdr);color:#eef2f1;position:relative;overflow:hidden}
header svg{position:absolute;right:-40px;top:-30px;opacity:.16}
header h1{font-size:28px;font-weight:800;position:relative;color:#fff}
header p{font-size:13px;opacity:.75;position:relative}
.wrap{padding:14px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;line-height:1.25;margin:4px 0 6px}
.meta{font-size:12px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--teal);background:var(--tealBg);border-radius:4px;padding:1px 7px;margin-right:6px}
.spons{color:var(--mute);background:transparent;border:1px dashed var(--mute)}
.alert{background:var(--acc);color:var(--accInk);border-radius:10px;padding:14px;margin-bottom:12px}
.alert b{font-family:"Bricolage Grotesque";font-size:16px}
.alert p{font-size:14px;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:600}
.btn.on{background:var(--tealBg);border-color:var(--teal);color:var(--teal)}
.ai{margin-top:10px;border-left:3px solid var(--teal);background:var(--tealBg);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14px}
.ai dt{font-weight:600;font-size:13px;margin-top:6px}.ai dt:first-child{margin-top:0}.ai dd{margin:0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);font-weight:600}
input[type=search],input[type=text],input[type=password],textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit}
.bar{height:26px;border-radius:6px;background:var(--tealBg);position:relative;overflow:hidden;margin-top:6px;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--teal);opacity:.35}
.bar span{position:relative;display:flex;justify-content:space-between;padding:3px 10px;font-size:13px}
.date{float:left;width:52px;text-align:center;margin-right:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.date b{display:block;background:var(--hdr);color:#eef2f1;font-size:11px;padding:1px 0}.date span{display:block;font:800 22px "Bricolage Grotesque";padding:2px 0}
.clr{clear:both}
h2{font-size:20px;margin:6px 0 10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ICON={
feed:'<path d="M4 5h16M4 10h10M4 15h16M4 20h8"/>',
market:'<path d="M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6"/>',
community:'<path d="M4 5h16v11H9l-5 4z"/>',
events:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
resources:'<path d="M5 4h10a4 4 0 014 4v12H9a4 4 0 01-4-4z"/><path d="M9 9h6"/>',
profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 5-6 8-6s7 1 8 6"/>'};
const TABS=[['feed','Feed'],['market','Market'],['community','Community'],['events','Events'],['resources','Library'],['profile','Profile']];

const TOPICS=['NSW Surveying','GNSS','Construction','GIS','AI & automation','Regulation','Drones & LiDAR','Software','Careers'];
const NEWS=[
{id:1,t:'Regulation',topics:['NSW Surveying','Regulation'],src:'Spatial Services NSW',time:'2h',title:'Updated requirements for deposited plan lodgement announced',ai:{what:'NSW has revised digital lodgement requirements for deposited plans, including new metadata fields.',why:'Plans that omit the new fields will be rejected at lodgement.',who:'Registered land surveyors and drafting staff in NSW.',when:'Takes effect 1 December 2026.'},alert:true},
{id:2,t:'GNSS',topics:['GNSS','Construction'],src:'Trimble',time:'5h',title:'Trimble releases firmware update for R-series receivers with improved multipath handling',imgs:[ph('#2b4a52','Receiver in the field'),ph('#0f6b73','Signal plot')],ai:{what:'New firmware adds better signal filtering in urban canyons.',why:'Fewer fixed-solution drop-outs on city construction sites.',who:'Owners of R-series GNSS receivers.',when:'Available now via the manufacturer portal.'}},
{id:3,t:'AI & automation',topics:['AI & automation','GIS'],src:'Industry commentary',time:'8h',title:'Automated feature extraction from LiDAR is moving from pilot to production',imgs:[ph('#f2542d','Classified point cloud')],ai:{what:'Several firms now run automated classification in daily workflows.',why:'Point-cloud processing time is dropping sharply.',who:'LiDAR and photogrammetry teams.',when:'Trend ongoing.'}},
{id:4,t:'Sponsored',sp:1,topics:['Drones & LiDAR'],src:'SkyGrid Drones',time:'Promoted',title:'See the new survey-grade drone with 3 cm accuracy and no ground control',ai:null},
{id:5,t:'Software',topics:['Software','GIS'],src:'Open-source GIS',time:'1d',title:'QGIS long-term release adds faster raster rendering and improved 3D views',ai:{what:'The latest release improves rendering speed on large rasters.',why:'Smoother workflows for big imagery datasets.',who:'GIS analysts using QGIS.',when:'Available now.'}},
{id:6,t:'Construction',topics:['Construction','NSW Surveying'],src:'Infrastructure news',time:'1d',title:'Major Sydney infrastructure package opens survey and monitoring tenders',imgs:[ph('#0f6b73','Corridor site'),ph('#2b4a52','Site plan'),ph('#f2542d','Monitoring points')],ai:{what:'New tenders released for control surveys and deformation monitoring.',why:'Large pipeline of work for consultancies.',who:'Survey firms and monitoring specialists.',when:'Tenders close in 5 weeks.'}},
{id:7,t:'Careers',topics:['Careers'],src:'Community activity',time:'2d',title:'Graduate surveyor intake numbers rise for the second consecutive year',ai:null}];
const JOBS=[
{c:'Jobs',title:'Registered Surveyor – Cadastral',by:'Harbour Survey Group',loc:'Sydney NSW',tag:'Permanent',feat:1},
{c:'Jobs',title:'GIS Analyst',by:'Coastal Council',loc:'Newcastle NSW',tag:'Contract'},
{c:'Jobs',title:'Graduate Surveyor',by:'Terra Consulting',loc:'Parramatta NSW',tag:'Graduate'},
{c:'Equipment',title:'Robotic total station, 1" (used)',by:'SurveyTrade',loc:'Wollongong NSW',tag:'$8,400',feat:1},
{c:'Equipment',title:'GNSS rover kit with controller',by:'Dealer Direct',loc:'Brisbane QLD',tag:'$14,900'},
{c:'Hire',title:'Laser scanner – daily hire',by:'ScanHire AU',loc:'Sydney NSW',tag:'$450/day'},
{c:'Software',title:'Point cloud processing – annual licence',by:'CloudPoint',loc:'Online',tag:'Trial available'},
{c:'Services',title:'Drone LiDAR capture and processing',by:'AirMap Services',loc:'NSW wide',tag:'Quote'},
{c:'Training',title:'CPD: Digital cadastre workshop',by:'Institution of Surveyors',loc:'Online',tag:'6 CPD pts'},
{c:'Tenders',title:'Control survey for rail corridor upgrade',by:'State agency',loc:'NSW',tag:'Closes 3 Nov'}];
const THREADS=[
{id:1,cat:'Software',q:'12d vs Civil 3D – what does your company actually use?',by:'M. Nguyen · Surveyor',votes:24,replies:31},
{id:2,cat:'AI',q:'How are people using AI in their surveying workflows?',by:'K. Patel · GIS analyst',votes:41,replies:56},
{id:3,cat:'Equipment',q:'Has anyone used the latest Trimble scanner on a live site?',by:'J. Smith · Construction surveyor',votes:12,replies:9,imgs:[ph('#0f6b73','Scan view 1'),ph('#f2542d','Scan view 2'),ph('#2b4a52','Site photo')]},
{id:4,cat:'Surveying',q:'How are other firms handling the new NSW lodgement requirement?',by:'R. Evans · Registered surveyor',votes:33,replies:18}];
let poll={q:'Which CAD platform does your company primarily use?',o:[['Civil 3D',48],['12d Model',31],['Other',21]],voted:-1};
const EVENTS=[
{d:'14',m:'OCT',title:'Sydney Geospatial Technology Conference',type:'Conference',loc:'Sydney',feat:1},
{d:'21',m:'OCT',title:'Webinar: Getting the most from GNSS corrections',type:'Webinar',loc:'Online'},
{d:'05',m:'NOV',title:'CPD Day: Cadastral law update',type:'CPD',loc:'Parramatta'},
{d:'19',m:'NOV',title:'Graduate networking night',type:'Networking',loc:'Sydney'}];
const DOCS=[
{t:'Survey practice guidance for cadastral plans',k:'Regulation',src:'Government publication',sec:'Sections 4 and 7'},
{t:'GNSS RTK field procedures',k:'Technical guide',src:'Industry guide',sec:'Chapter 3'},
{t:'Standard for control surveys',k:'Standard',src:'Surveying standard',sec:'Part 2'},
{t:'Deposited plan checklist template',k:'Template',src:'Template',sec:'Full document'},
{t:'LiDAR classification tutorial',k:'Tutorial',src:'Tutorial',sec:'Steps 1 to 6'}];

const S={tab:'feed',topic:'All',cat:'All',ccat:'All',follow:new Set(['NSW Surveying','GNSS','Construction']),saved:new Set(),open:new Set(),reg:new Set(),up:new Set(),q:'',ans:null,profile:{name:'Alex Morgan',role:'Surveyor',loc:'NSW'}};
const save=(k,v)=>{S[k].has(v)?S[k].delete(v):S[k].add(v);render()};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}

const hdr=(t,s)=>`<header><svg width="260" height="260" viewBox="0 0 260 260" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="130" cy="130" r="30"/><circle cx="130" cy="130" r="55"/><ellipse cx="130" cy="130" rx="85" ry="70"/><ellipse cx="130" cy="130" rx="115" ry="95"/></svg><h1>${t}</h1><p>${s}</p></header>`;
const chips=(list,cur,fn)=>`<div class="chips">${['All',...list].map(x=>`<button class="chip ${cur===x?'on':''}" onclick="${fn}('${x}')">${x}</button>`).join('')}</div>`;

function feed(){
 const list=NEWS.filter(n=>S.topic==='All'?true:n.topics.includes(S.topic));
 // personalise: followed topics first
 list.sort((a,b)=>b.topics.filter(t=>S.follow.has(t)).length-a.topics.filter(t=>S.follow.has(t)).length);
 return hdr('Bearing','What is happening in geospatial today')+
 chips(TOPICS,S.topic,'setTopic')+
 `<div class="wrap">${list.map(n=>{
  const mine=n.topics.filter(t=>S.follow.has(t))[0];
  const body=`<div class="meta">${n.sp?'<span class="tag spons">Sponsored</span>':`<span class="tag">${n.t}</span>`}${n.src} · ${n.time}${mine&&!n.sp?' · because you follow '+mine:''}</div><h3>${n.title}</h3>${gal(n.imgs)}${n.imgs?`<div class="meta" style="margin-top:4px">Image: ${n.credit||n.src}</div>`:''}`;
  const x=n.ai||{},open=S.open.has(n.id),row=(l,v)=>v?`<dt>${l}</dt><dd>${v}</dd>`:'';
  const ai=open?`<dl class="ai">${row('What happened',x.what)}${row('Why it matters',x.why)}${row('Who is affected',x.who)}${row('When it takes effect',x.when)}</dl>`:'';
  const act=`<div class="row"><span><button class="btn ${open?'on':''}" onclick="save('open','${n.id}')">${open?'Collapse':'Expand'}</button> <a class="btn" style="text-decoration:none" href="${n.url}" target="_blank" rel="noopener noreferrer">Read the original</a></span><button class="btn ${S.saved.has('n'+n.id)?'on':''}" onclick="save('saved','n${n.id}')">${S.saved.has('n'+n.id)?'Saved':'Save'}</button></div>`;
  const a=n.alert?`<div class="alert"><b>Industry alert</b><p>${n.title}</p><div class="row"><span class="meta" style="color:inherit">${n.src} · ${n.time}</span><a class="btn" style="color:#fff;border-color:#fff;text-decoration:none" href="${n.url}" target="_blank" rel="noopener noreferrer">Read the original</a></div></div>`:'';
  return a+`<div class="card">${body}${ai}${act}</div>`}).join('')||'<p class="meta">No stories yet. Editors publish new stories here.</p>'}</div>`;
}
function market(){
 const cats=['Jobs','Equipment','Hire','Software','Services','Training','Tenders'];
 const l=JOBS.filter(j=>mvis(j)&&(S.cat==='All'||j.c===S.cat)).sort((a,b)=>(b.feat||0)-(a.feat||0));
 return hdr('Marketplace','Jobs, kit, software, services and tenders')+chips(cats,S.cat,'setCat')+
 `<div class="wrap">${lform()}${l.map((j,i)=>`<div class="card"><div class="meta">${j.feat?'<span class="tag spons">Featured</span>':''}<span class="tag">${j.c}</span>${j.tag}</div><h3>${j.title}</h3><div class="meta">${j.by} · ${j.loc}</div><div class="row"><span></span><span><button class="btn ${S.saved.has('j'+j.id)?'on':''}" onclick="save('saved','j${j.id}')">Save</button> <button class="btn pri" onclick="toast('Enquiry sent to ${j.by.replace(/'/g,'')}')">${j.c==='Jobs'?'Apply':'Enquire'}</button> <button class="btn" onclick="rep('l',${j.id})">Report</button></span></div>${lnote(j)}</div>`).join('')}</div>`;
}
function community(){
 const cats=['Surveying','Software','AI','Equipment'];
 const tot=poll.o.reduce((s,x)=>s+x[1],0);
 return hdr('Community','Ask, answer and compare notes')+chips(cats,S.ccat,'setCC')+
 `<div class="wrap">${rules()}<div class="card"><input type="text" id="np" placeholder="Ask the community a question" value="${S.draft.replace(/"/g,'&quot;')}" oninput="S.draft=this.value">${S.imgs.length?`<div style="display:flex;gap:8px;overflow-x:auto;margin-top:10px">${S.imgs.map((u,i)=>`<div style="position:relative;flex:none"><img src="${u}" alt="Attached photo ${i+1}" style="width:96px;height:96px;object-fit:cover;border-radius:8px;display:block"><button class="btn" aria-label="Remove photo ${i+1}" style="position:absolute;top:4px;right:4px;padding:0 7px;background:var(--card)" onclick="S.imgs.splice(${i},1);render()">×</button></div>`).join('')}</div>`:''}<div class="meta" style="margin-top:8px">Remove client names and site addresses first. Photo location data is removed automatically.</div><div class="row"><label class="btn" style="cursor:pointer">${S.imgs.length?'Add more ('+S.imgs.length+'/4)':'Add photos'}<input type="file" accept="image/*" multiple hidden onchange="pick(this)"></label><button class="btn pri" onclick="post()">Post question</button></div></div>
 <div class="card"><div class="meta"><span class="tag">Poll</span>${tot} votes</div><h3>${poll.q}</h3>${poll.o.map((o,i)=>`<div class="bar" onclick="vote(${i})"><i style="width:${poll.voted<0?0:Math.round(o[1]/tot*100)}%"></i><span><b>${o[0]}</b><span>${poll.voted<0?'':Math.round(o[1]/tot*100)+'%'}</span></span></div>`).join('')}<div class="meta" style="margin-top:8px">${poll.voted<0?'Vote to see results. Responses are anonymous.':'Thanks for voting.'}</div></div>
 ${THREADS.filter(vis).filter(t=>S.ccat==='All'||t.cat===S.ccat).map(tcard).join('')}</div>`;
}
function events(){
 return hdr('Events','Conferences, CPD, webinars and training')+
 `<div class="wrap">${EVENTS.map((e,i)=>`<div class="card"><div class="date"><b>${e.m}</b><span>${e.d}</span></div><div class="meta">${e.feat?'<span class="tag spons">Featured event</span>':''}<span class="tag">${e.type}</span></div><h3>${e.title}</h3><div class="meta">${e.loc}</div><div class="clr"></div><div class="row"><span></span><span><button class="btn ${S.saved.has('e'+i)?'on':''}" onclick="save('saved','e${i}')">Save</button> <button class="btn ${S.reg.has(i)?'on':'pri'}" onclick="reg(${i})">${S.reg.has(i)?'Registered':'Register'}</button></span></div></div>`).join('')}</div>`;
}
function resources(){
 const q=S.q.trim().toLowerCase();
 const hits=q?DOCS.filter(d=>(d.t+d.k).toLowerCase().split(/\W+/).some(w=>w&&q.includes(w.slice(0,5)))||q.split(/\W+/).some(w=>w.length>3&&(d.t+d.k).toLowerCase().includes(w))):DOCS;
 return hdr('Library','Standards, regulations and guides you keep coming back to')+
 `<div class="wrap"><input type="search" id="rq" placeholder="Ask e.g. cadastral survey plan requirements" value="${S.q.replace(/"/g,'')}" onkeydown="if(event.key==='Enter')ask()"><div class="row"><span class="meta">Natural-language search</span><button class="btn pri" onclick="ask()">Search</button></div>
 ${S.ans?`<div class="ai"><b>AI summary</b><p>${S.ans}</p><p class="meta" style="margin-top:6px">This is a generated summary, not an authoritative source. Confirm details in the documents below.</p></div>`:''}
 <h2 style="margin-top:16px">${q?'Sources':'All resources'}</h2>
 ${hits.map((d,i)=>`<div class="card"><div class="meta"><span class="tag">${d.k}</span>${d.src}</div><h3>${d.t}</h3><div class="meta">${d.sec}</div><div class="row"><span></span><button class="btn ${S.saved.has('r'+d.t)?'on':''}" onclick="save('saved','r${d.t}')">Save to library</button></div></div>`).join('')||'<p class="meta">No matching documents. Try different keywords.</p>'}</div>`;
}
function profile(){
 const p=S.profile;
 const sv=[...S.saved].map(savedName).filter(Boolean);
 return hdr(p.name,`${p.role} · ${p.loc}`)+
 `<div class="wrap">${trust()}<h2>Topics you follow</h2><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">${TOPICS.map(t=>`<button class="chip ${S.follow.has(t)?'on':''}" onclick="fol('${t}')">${t}</button>`).join('')}</div>
 <div class="card"><h3>Your feed learns from</h3><p class="meta">Profession, location, followed topics, what you read and save, and your community activity.</p></div>
 <h2>Saved (${sv.length})</h2>${sv.map(s=>`<div class="card" style="padding:10px 14px">${s}</div>`).join('')||'<p class="meta">Nothing saved yet. Tap Save on any article, job, event or document.</p>'}
 <h2 style="margin-top:16px">Registered events (${S.reg.size})</h2>${[...S.reg].map(i=>`<div class="card" style="padding:10px 14px">${EVENTS[i].title}</div>`).join('')||'<p class="meta">No registrations yet.</p>'}
 <h2 style="margin-top:16px">Profile</h2><div class="card"><label class="meta">Discipline</label><input type="text" value="${p.role}" onchange="saveProf('role',this.value)"><label class="meta" style="display:block;margin-top:8px">Location</label><input type="text" value="${p.loc}" onchange="saveProf('location',this.value)"></div></div>`;
}
const setTopic=t=>{S.topic=t;render()},setCat=c=>{S.cat=c;render()},setCC=c=>{S.ccat=c;render()};
const fol=t=>{save('follow',t)};
const up=id=>{save('up',id)};
const reg=i=>{S.reg.has(i)?S.reg.delete(i):(S.reg.add(i),toast('Registered. Reminder added to your calendar.'));render()};
S.draft='';S.imgs=[];
function ph(c,t){return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="${c}"/><g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"><ellipse cx="200" cy="150" rx="40" ry="28"/><ellipse cx="200" cy="150" rx="90" ry="62"/><ellipse cx="200" cy="150" rx="150" ry="100"/></g><text x="20" y="280" fill="#fff" font-size="18" font-family="sans-serif">${t}</text></svg>`)}
function gal(a){if(!a||!a.length)return'';const id='g'+Math.random().toString(36).slice(2,7);

 const{error}=await sb.from('articles').insert({title:i.title,source_name:s?s.name:'Source',source_url:i.url,category:i.suggested_category||null,topics:i.suggested_topics||[],summary:{what:'',why:'',who:'',when:''},rights_status:'link_only'});
 if(error){toast(error.message);return}
 await sb.from('inbox').update({status:'drafted'}).eq('id',id);await Promise.all([loadInbox(),loadDrafts()]);render();toast('Draft created. Write your own summary in the editor desk below.')}
async function inDrop(id){const{error}=await sb.from('inbox').update({status:'discarded'}).eq('id',id);if(error){toast(error.message);return}await loadInbox();render()}
async function saveProf(k,v){S.profile[k]=esc(cl(v));await sb.from('profiles').update({[k==='role'?'discipline':'location']:cl(v)}).eq('id',S.user.id);render()}
function trust(){const r=(S.prof&&S.prof.role)||'member';return `<div class="card"><h3>Account</h3><p class="meta">${esc(S.user.email)} · ${esc(r)}</p><div class="row"><span class="meta">${trusted()?'Trusted member':'New member: first posts are checked ('+((S.prof&&S.prof.approved_posts)||0)+' of 2 approved).'}</span><button class="btn" onclick="logout()">Log out</button></div></div>${isEd()?edDesk():''}`}
function pick(inp){const fs=[...inp.files].slice(0,4-S.imgs.length);inp.value='';if(!fs.length){toast('Maximum 4 photos per post');return}
 Promise.all(fs.map(f=>new Promise(res=>{if(!f.type.startsWith('image/'))return res(null);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)}))).then(u=>{const ok=u.filter(Boolean);if(ok.length<u.length)toast('Some files were not images');S.imgs=S.imgs.concat(ok).slice(0,4);render()})}
function ask(){S.q=$('#rq').value;const q=S.q.toLowerCase();
 S.ans=!q.trim()?null:q.includes('cadastral')||q.includes('plan')||q.includes('nsw')?'Cadastral plans in NSW must follow current practice guidance and use the digital lodgement format, including the revised metadata fields. Check sections 4 and 7 of the guidance document and the deposited plan checklist.':q.includes('gnss')?'RTK fieldwork relies on a stable base or network corrections, a defined initialisation check and independent verification of fixed positions. See the GNSS field procedures guide.':'Here are the documents that best match your question. Open the sources for the authoritative wording.';
 render()}
const V={feed,market,community,events,resources,profile};
/* ===== Stage 2: live Community, photos, reports, moderation ===== */
S.posts=[];S.hold=[];S.reports=[];S.poll=null;
const isStaff=()=>['moderator','editor','admin'].includes(S.prof&&S.prof.role);
const imgUrl=p=>sb.storage.from('post-images').getPublicUrl(p).data.publicUrl;
async function loadPosts(){const{data,error}=await sb.from('posts').select('*, profiles(display_name,discipline)').order('created_at',{ascending:false}).limit(60);if(error){toast('Could not load posts');return}S.posts=data}
async function loadQueue(){if(!isStaff()){S.hold=[];S.reports=[];return}
 const[a,b]=await Promise.all([sb.from('reports').select('*').eq('resolved',false).order('created_at'),sb.from('posts').select('*, profiles(display_name,discipline)').or('status.eq.pending,and(status.eq.removed,appeal.eq.true)').order('created_at')]);
 S.reports=a.data||[];S.hold=b.data||[]}
async function loadPoll(){const{data:p}=await sb.from('polls').select('*').eq('active',true).order('created_at',{ascending:false}).limit(1);if(!p||!p[0]){S.poll=null;return}const q=p[0];
 const[r,v]=await Promise.all([sb.rpc('poll_results',{p:q.id}),sb.from('poll_votes').select('option_index').eq('poll_id',q.id)]);
 S.poll={...q,res:r.data||[],voted:v.data&&v.data.length?v.data[0].option_index:-1}}
async function enter(){await loadProfile();await Promise.all([loadArticles(),loadDrafts(),loadPosts(),loadPoll(),loadInbox()]);await loadQueue()}
async function vote(i){const{error}=await sb.from('poll_votes').insert({poll_id:S.poll.id,option_index:i});if(error){toast('Could not save your vote');return}await loadPoll();render()}
function community(){const cats=['Surveying','Software','AI','Equipment'],P=S.poll,me=S.user.id;
 const list=S.posts.filter(p=>(p.status==='live'||p.author_id===me)&&(S.ccat==='All'||p.category===S.ccat));
 const tot=P?P.res.reduce((s,x)=>s+Number(x.votes),0):0,cnt=i=>{const r=P.res.find(x=>x.option_index===i);return r?Number(r.votes):0},pc=i=>tot?Math.round(cnt(i)/tot*100):0;
 return hdr('Community','Ask, answer and compare notes')+chips(cats,S.ccat,'setCC')+`<div class="wrap">${rules()}
 <div class="card"><input type="text" id="np" placeholder="Ask the community a question" maxlength="2000" value="${esc(S.draft)}" oninput="S.draft=this.value">${S.imgs.length?`<div style="display:flex;gap:8px;overflow-x:auto;margin-top:10px">${S.imgs.map((u,i)=>`<div style="position:relative;flex:none"><img src="${u}" alt="Attached photo ${i+1}" style="width:96px;height:96px;object-fit:cover;border-radius:8px;display:block"><button class="btn" aria-label="Remove photo ${i+1}" style="position:absolute;top:4px;right:4px;padding:0 7px;background:var(--card)" onclick="S.imgs.splice(${i},1);render()">×</button></div>`).join('')}</div>`:''}<div class="meta" style="margin-top:8px">Remove client names and site addresses first. Photo location data is removed automatically.</div><div class="row"><label class="btn" style="cursor:pointer">${S.imgs.length?'Add more ('+S.imgs.length+'/4)':'Add photos'}<input type="file" accept="image/*" multiple hidden onchange="pick(this)"></label><button class="btn pri" id="pb" onclick="post()">Post question</button></div></div>
 ${P?`<div class="card"><div class="meta"><span class="tag">Poll</span>${tot} votes</div><h3>${esc(P.question)}</h3>${P.options.map((o,i)=>`<div class="bar" onclick="vote(${i})"><i style="width:${P.voted<0?0:pc(i)}%"></i><span><b>${esc(o)}</b><span>${P.voted<0?'':pc(i)+'%'}</span></span></div>`).join('')}<div class="meta" style="margin-top:8px">${P.voted<0?'Vote to see results. Responses are anonymous.':'Thanks for voting.'}</div></div>`:''}
 ${list.map(tcard).join('')||'<p class="meta">No posts yet. Be the first to ask a question.</p>'}</div>`}
function tcard(t){const mine=t.author_id===S.user.id,by=t.profiles?esc(t.profiles.display_name)+' · '+esc(t.profiles.discipline||'Member'):'Member';
 const badge=t.status==='pending'?'<div class="meta" style="margin-top:6px"><span class="tag spons">Awaiting review</span>Only you can see this until it is approved.</div>':t.status==='removed'?`<div class="meta" style="margin-top:6px"><span class="tag spons">Removed</span>${esc(t.removal_reason||'Removed for breaching the community rules.')}</div>`:'';
 const acts=t.status==='removed'?(t.appeal?'<span class="meta">Appeal sent</span>':`<button class="btn" onclick="appeal('${t.id}')">Appeal decision</button>`):(mine?`<button class="btn" onclick="delPost('${t.id}')">Delete</button>`:`<button class="btn" onclick="rep('p','${t.id}')">Report</button>`);
 return `<div class="card"><div class="meta"><span class="tag">${esc(t.category)}</span>${by} · ${ago(t.created_at)}</div><h3 style="font-weight:600;font-size:16px">${esc(t.body)}</h3>${t.status==='removed'?'':gal((t.image_paths||[]).map(imgUrl))}<div class="meta" style="margin-top:4px">Community opinion, not professional advice</div><div class="row"><span></span><span>${acts}</span></div>${badge}</div>`}
async function post(){const v=S.draft.trim();if(!v){toast('Write a question first');return}
 const b=$('#pb');b.disabled=true;b.textContent='Posting...';const paths=[];
 for(const u of S.imgs){const blob=await (await fetch(u)).blob(),path=S.user.id+'/'+crypto.randomUUID()+'.jpg';const{error}=await sb.storage.from('post-images').upload(path,blob,{contentType:'image/jpeg'});if(error){toast('Photo upload failed: '+error.message);render();return}paths.push(path)}
 const{data,error}=await sb.from('posts').insert({body:v,category:S.ccat==='All'?'Surveying':S.ccat,image_paths:paths}).select().single();
 if(error){toast(error.message);render();return}
 S.draft='';S.imgs=[];await Promise.all([loadPosts(),loadProfile()]);await loadQueue();render();toast(data.status==='live'?'Posted':'Sent for review before it goes live')}
async function delPost(id){if(!confirm('Delete this post?'))return;const{error}=await sb.from('posts').delete().eq('id',id);if(error){toast(error.message);return}await Promise.all([loadPosts(),loadQueue()]);render()}
async function appeal(id){const{error}=await sb.rpc('appeal_post',{p:id});if(error){toast(error.message);return}await loadPosts();render();toast('Appeal sent to a moderator')}
async function sendRep(i){const{k,ref}=S.rep;S.rep=null;if(k!=='p'){render();toast('Reporting listings arrives with the Marketplace update');return}
 const{error}=await sb.from('reports').insert({target_type:'post',target_id:ref,reason:REASONS[i]});render();toast(error?(error.code==='23505'?'You have already reported this':error.message):'Report sent. Thank you.')}
async function modPost(id,a){let patch={status:'live',removal_reason:null,appeal:false};
 if(a==='rm'){const why=prompt('Reason shown to the author:','Breaches the community rules');if(why===null)return;patch={status:'removed',appeal:false,removal_reason:why.trim()||'Breaches the community rules'}}
 const{error}=await sb.from('posts').update(patch).eq('id',id);if(error){toast(error.message);return}
 await sb.from('reports').update({resolved:true}).eq('target_type','post').eq('target_id',id);
 await Promise.all([loadPosts(),loadQueue()]);render();toast(a==='ok'?'Decision saved':'Post removed')}
function modq(){const items=[],seen=new Set();(S.hold||[]).forEach(p=>{seen.add(p.id);items.push({p,why:p.status==='removed'?'Appeal from author':'Held for review'})});
 (S.reports||[]).filter(r=>r.target_type==='post').forEach(r=>{const p=S.posts.find(x=>x.id===r.target_id);if(p&&!seen.has(p.id)){seen.add(p.id);items.push({p,why:'Reported: '+r.reason})}});
 return `<h2>Moderation queue (${items.length})</h2>${items.map(({p,why})=>`<div class="card"><div class="meta"><span class="tag">Post</span>${esc(why)}</div><h3 style="font-size:16px">${esc(p.body)}</h3><div class="meta">${esc(p.profiles?p.profiles.display_name:'Member')}</div>${gal((p.image_paths||[]).map(imgUrl))}<div class="row"><span></span><span><button class="btn pri" onclick="modPost('${p.id}','ok')">${why.startsWith('Reported')?'Keep':why.startsWith('Appeal')?'Restore':'Approve'}</button> <button class="btn" onclick="modPost('${p.id}','rm')">Remove</button></span></div></div>`).join('')||'<p class="meta">Queue is clear.</p>'}`}
function trust(){const r=(S.prof&&S.prof.role)||'member';return `<div class="card"><h3>Account</h3><p class="meta">${esc(S.user.email)} · ${esc(r)}</p><div class="row"><span class="meta">${trusted()?'Trusted member':'New member: first posts are checked ('+((S.prof&&S.prof.approved_posts)||0)+' of 2 approved).'}</span><button class="btn" onclick="logout()">Log out</button></div></div>${isEd()?edDesk():''}${isStaff()?modq():''}`}
function render(){
 const y=window.scrollY;
 if(!S.ready){$('#app').innerHTML='<p class="meta" style="padding:24px">Loading...</p>';return}if(!S.user){$('#app').innerHTML=authView();return}$('#app').innerHTML=(['market','events','resources'].includes(S.tab)?'<div style="background:var(--hdr);color:#eef2f1;font-size:12px;text-align:center;padding:6px 12px">Sample content while this section is being connected</div>':'')+V[S.tab]()+`<nav>${TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')" aria-label="${l}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}</button>`).join('')}</nav>${sheet()}`;
 window.scrollTo(0,y);
}
function go(t){S.tab=t;render();window.scrollTo(0,0)}
render();boot();
</script>
</body>
</html>
